[project]
name = "mdify"
version = "0.1.0"
description = "Markdownify: any digital source to markdown in which every word links back to where it sits in the source."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# WHY an extra: docling pulls torch and its layout models (GBs); the core, the checker and the HTML path don't need it.
pdf = ["docling>=2.50", "torch", "torchvision"]
# Web capture (CONTRACT §2.1): WARC records and the WACZ package, both Webrecorder's, stock.
capture = ["warcio>=1.7", "wacz>=0.5", "playwright>=1.48", "pillow>=10"]
# The round-trip harness (the ruler) — kept apart from the pipelines it grades.
harness = ["playwright>=1.48", "pymupdf>=1.24", "img2pdf>=0.5", "apted>=1.0", "lxml>=5", "jiwer>=3.0"]

[project.scripts]
mdify = "mdify.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdify"]

# WHY cu128: this machine's driver is CUDA 12.8; PyPI's default torch wheels need a newer driver and fall back to
# CPU (vault memory marker-pdf-to-markdown-recipe, 2026-06-23).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
